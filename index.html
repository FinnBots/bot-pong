<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" data-fb-vp="1">
<title>Bot Pong</title>
<style>
  :root{
    --accent:#f2a03d; --ink:#0d1017; --court:#111722; --line:#243247;
    --paper:#e9edf4; --muted:#7d8aa0; --win:#5bd6a0; --lose:#ff6b6b;
    --edge:#1b2431;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink); color:var(--paper);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    overflow:hidden; user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  header,.facts,.controls,footer{flex:0 0 auto}
  .stage{flex:1 1 auto; position:relative; min-height:0}

  /* testbar — only shown when TEST_MODE */
  #testbar{display:none; background:#3a2a00; color:#ffd479; text-align:center;
    font-size:12px; padding:4px 8px; letter-spacing:.02em}
  body.test #testbar{display:block}

  header{display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--edge)}
  header img{width:30px;height:30px;border-radius:7px;background:var(--court);
    border:1px solid var(--line)}
  header .title{font-size:18px;font-weight:700;letter-spacing:.01em}
  header .title b{color:var(--accent)}
  header .spacer{flex:1}
  header .who{font-size:12px;color:var(--muted)}

  .facts{display:flex;gap:0;border-bottom:1px solid var(--edge);
    background:var(--court)}
  .facts div{flex:1;padding:7px 6px;text-align:center;
    border-right:1px solid var(--edge)}
  .facts div:last-child{border-right:0}
  .facts .k{font-size:10px;color:var(--muted)}
  .facts .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .facts .v.you{color:var(--accent)}

  canvas{display:block;width:100%;height:100%}

  .controls{padding:8px 14px;border-top:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center;gap:14px;
    font-size:12px;color:var(--muted);min-height:40px}
  .controls kbd{background:var(--court);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;color:var(--paper);font-family:inherit}
  .touchonly{display:none}
  @media (pointer:coarse){ .keyonly{display:none} .touchonly{display:inline} }

  footer{display:flex;gap:0;border-top:1px solid var(--edge)}
  footer a{flex:1;text-align:center;padding:10px 6px;color:var(--muted);
    text-decoration:none;font-size:13px;border-right:1px solid var(--edge)}
  footer a:last-child{border-right:0}
  footer a:hover,footer a:focus{color:var(--accent);outline:none}
  footer a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* modal */
  .modal{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;background:rgba(6,9,14,.86);padding:20px;z-index:5}
  .modal[hidden]{display:none}
  .card{background:var(--court);border:1px solid var(--line);border-radius:14px;
    padding:22px 22px 20px;max-width:340px;width:100%;text-align:center}
  .card h1{margin:0 0 4px;font-size:24px}
  .card h1.you{color:var(--win)} .card h1.cpu{color:var(--lose)}
  .card p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
  .card .big{font-size:15px;color:var(--paper);margin-top:10px;
    font-variant-numeric:tabular-nums}
  .btn{margin-top:18px;display:inline-block;background:var(--accent);
    color:#20160a;border:none;border-radius:10px;font-size:16px;font-weight:700;
    padding:12px 26px;cursor:pointer;font-family:inherit;width:100%}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .rules{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
<style id="fb-brand">
/* ===== FINNBOTS BRAND LAYER v1 (2026-09-24) ==========================
   Append-only override, injected as <style id="fb-brand"> AFTER every other
   style block so it wins without editing a single line of a game's own CSS.
   Three jobs:
     1. BRAND  — the FinnBots lockup (bot mark + FINN/BOTS wordmark) in the topbar.
     2. CABINET — the canvas reads as an arcade screen: bezel, amber rim light, glow.
     3. THEME  — dark-mode parity with the hub (games.finnstergram.com adapts, the
                 games did not, so hub -> game was a light/dark slap in the face).
   Source of truth: factory/templates/brand-layer.css. Never hand-edit a game copy;
   change it here and re-run apply-brand.sh. ==================================== */
:root{
  --fb-amber:#f2a03d; --fb-plum:#5f4c57; --fb-plum-deep:#3e323a;
  --fb-screen:#241b28; --fb-bezel:#3e323a; --fb-rim:rgba(242,160,61,.45);
  --fb-ink:#3e323a; --fb-surface:rgba(255,255,255,.55);
}

/* ---- 1. BRAND LOCKUP --------------------------------------------------- */
.fb-mark{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  text-decoration:none; color:var(--fb-plum); line-height:1;
  padding:2px 4px; border-radius:999px; -webkit-tap-highlight-color:transparent;
}
.fb-mark:hover{ color:var(--fb-plum-deep); }
.fb-mark:focus-visible{ outline:3px solid var(--electric,#3a6ff7); outline-offset:2px; }
.fb-bot{ width:22px; height:22px; flex:none; display:block; }
.fb-word{
  font-family:var(--disp,'Jersey 15',system-ui,sans-serif);
  font-size:16px; letter-spacing:.5px; color:currentColor; white-space:nowrap;
}
.fb-word i{ font-style:normal; color:var(--fb-amber); }
/* Phones: the topbar also carries the mode pills + icon buttons, so drop the
   wordmark and keep the bot mark rather than letting the row overflow. */
@media (max-width:430px){ .fb-word{ display:none; } }
body.is-portrait .fb-bot{ width:20px; height:20px; }

</style>
<style id="fb-device">
/* ==========================================================================
   FinnBots DEVICE LAYER — ONE scaling contract for laptop, tablet and phone.
   Founder rule, 2026-09-25: "all games ... need to be playable on Laptops,
   tablets and phones."

   SOURCE OF TRUTH. Never hand-edit a game's copy — edit this file and re-run
   apply-device.js across the roster (same discipline as brand-layer.css).

   It is injected as the LAST <style> in <head>, AFTER the brand layer, so it
   wins by source order and touches no existing CSS line. Everything below
   section 3 assumes chassis markup; apply-device.js --safe stops before it for
   the non-chassis games whose class names mean something else.

   THE MODEL, in one line: the page is exactly one visible viewport tall, the
   chrome is whatever is left after the play surface has taken what it needs,
   and the controls are always reachable by the thumb that owns them.
   ========================================================================== */

/* ---- 1. the page fills the VISIBLE viewport ------------------------------
   100vh on a phone is the viewport WITHOUT the browser's collapsing chrome:
   a vh-sized column is taller than the screen, so the controls sit under the
   address bar and the canvas is cut off. dvh tracks the real thing, and the
   safe-area insets keep the notch and the home indicator off the buttons. */
:root{
  --fb-safe-t: env(safe-area-inset-top, 0px);
  --fb-safe-b: env(safe-area-inset-bottom, 0px);
  --fb-safe-l: env(safe-area-inset-left, 0px);
  --fb-safe-r: env(safe-area-inset-right, 0px);
  --fb-tap: 48px;                     /* 44 is the accessibility floor; 48 is comfortable */
}
html{ height:100%; }
body{ min-height:100svh; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
@supports (height:100dvh){ body{ min-height:100dvh; } }

/* ---- 2. touch behaviour -------------------------------------------------
   Without these a double-tap on a control zooms the page, a long press pops a
   selection bubble mid-game, and a drag on the canvas pulls the page to
   refresh. All three are "the game is broken" to a player on a phone. */
.ctl,.btn,.again,.ghostbtn,.modepill,.iconbtn,button{
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
canvas{ touch-action:none; }

/* ---- 3. hit targets on anything with a finger --------------------------- */
@media (pointer:coarse){
  .ctl{ min-width:var(--fb-tap); min-height:var(--fb-tap); }
  .btn,.again,.ghostbtn{ min-height:var(--fb-tap); }
  .modepill{ min-height:34px; }
}

/* ---- 8. STICKINESS FURNITURE -------------------------------------------
   Rendered by the fb-sticky script: a personal-best chip in the topbar and a
   "what happened this run" line on the run-over card. No wallet, no network,
   no engine change — it reads the score the game already prints. */
.fb-best{
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#f2a03d; background:rgba(242,160,61,.14);
  border:1px solid rgba(242,160,61,.38); padding:4px 9px; border-radius:999px;
}
.fb-best i{ font-style:normal; opacity:.72; letter-spacing:.06em; }
.fb-best b{ color:#fdf3e7; font-weight:800; }
.fb-best.is-new{ color:#5fd6b4; background:rgba(95,214,180,.16); border-color:rgba(95,214,180,.45); }
.fb-runline{ margin:8px 0 0; font:700 13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.fb-runline .go{ color:#5fd6b4; }
.fb-runline .gap{ color:#f2a03d; }
.fb-runline small{ display:block; font-weight:600; opacity:.7; font-size:11px; margin-top:3px; }
/* On a phone the topbar is already lockup + title + mode pills + two icon
   buttons; adding the chip pushed the game's own name out of its own bar. The
   best score still appears where it actually drives a replay — the run-over
   card — so the chip is a tablet-and-up affordance. */
@media (max-width:620px){ .fb-best{ display:none; } }
@media (orientation:landscape) and (max-height:560px){ .fb-best{ display:none; } }
</style>
</head>
<body>
  <div id="testbar">TEST MODE — no live surface</div>

  <header>
    <img id="pfp" alt="" src="https://arweave.net/_cPSCheRvzVBlZK7QwM-3nXtteMdBbUn-zJhbGRlMmo/106.png">
    <!--fb:pongtitle--><a class="fb-mark" href="https://games.finnstergram.com" aria-label="FinnBots — more games"><svg class="fb-bot" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="M14 5.4V3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="2" r="1.85" fill="var(--fb-amber)"/><rect x="1" y="11" width="2.6" height="6" rx="1.3" fill="currentColor"/><rect x="24.4" y="11" width="2.6" height="6" rx="1.3" fill="currentColor"/><rect x="3.6" y="5" width="20.8" height="18" rx="5.5" fill="currentColor"/><rect x="6.6" y="8.6" width="14.8" height="9.4" rx="2.6" fill="var(--fb-screen)"/><circle cx="10.7" cy="13.3" r="1.9" fill="var(--fb-amber)"/><circle cx="17.3" cy="13.3" r="1.9" fill="var(--fb-amber)"/></svg><span class="fb-word">FINN<i>BOTS</i></span></a><!--/fb-->
    <div class="title">Bot <b>Pong</b></div>
    <div class="spacer"></div>
    <div class="who">You vs Cam</div>
  </header>

  <div class="facts">
    <div><div class="k">You</div><div class="v you" id="scoreYou">0</div></div>
    <div><div class="k">First to</div><div class="v" id="target">11</div></div>
    <div><div class="k">Cam</div><div class="v" id="scoreCpu">0</div></div>
  </div>

  <div class="stage">
    <canvas id="court"></canvas>
    <div class="modal" id="modal">
      <div class="card" id="card">
        <h1 id="cardTitle">Bot Pong</h1>
        <p id="cardText">Get the ball past Cam. First to 11 wins.</p>
        <div class="rules">
          Drag to move your paddle — the ball speeds up every rally.

        <button class="btn" id="startBtn">Play</button>

    </div>

  <div class="controls">
    <span class="keyonly">Move: <kbd>↑</kbd> <kbd>↓</kbd> &nbsp;·&nbsp; Pause: <kbd>P</kbd></span>
    <span class="touchonly">Drag anywhere on the court to move your paddle</span>
  </div>

  <footer>
    <a href="https://magiceden.io/marketplace/finnbot" target="_blank" rel="noopener">Buy a Bot</a>
    <a href="https://games.finnstergram.com" target="_blank" rel="noopener">More games</a>
  </footer>

<script>
/* ---- Bot Pong — Free only, wallet-dead (no wallet code, no memo, no money path). ---- */
const TEST_MODE = false;
if (TEST_MODE) document.body.classList.add('test');

/* ---- Tunables (data-driven: change a value, not the code) ---- */
const CFG = {
  winScore:    11,
  paddleH:     0.18,   // fraction of court height
  paddleW:     12,     // px
  ballR:       13,     // px — the ball IS Bot #106 (Cam), sized to read clearly
  ballSpeed0:  6.2,    // starting px/frame at 60fps-equiv
  ballSpeedUp: 1.045,  // multiply on each paddle hit
  ballSpeedMax:16,
  cpuEase:     0.085,  // CPU tracking (lower = beatable)
  cpuMiss:     0.10,   // CPU aim jitter (fraction of paddle height)
  accent:      '#f2a03d',
};

const cv = document.getElementById('court');
const ctx = cv.getContext('2d');
const modal = document.getElementById('modal');
const startBtn = document.getElementById('startBtn');
const cardTitle = document.getElementById('cardTitle');
const cardText = document.getElementById('cardText');
const elYou = document.getElementById('scoreYou');
const elCpu = document.getElementById('scoreCpu');
document.getElementById('target').textContent = CFG.winScore;

/* Cam #106 as the ball, with a filled-disc fallback if the image is blocked */
const camImg = new Image();
camImg.crossOrigin = 'anonymous';
let camReady = false;
camImg.onload = () => camReady = true;
camImg.onerror = () => camReady = false;
camImg.src = 'https://arweave.net/_cPSCheRvzVBlZK7QwM-3nXtteMdBbUn-zJhbGRlMmo/106.png';

let W = 0, H = 0, DPR = 1;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ---- State ---- */
const G = {
  state: 'ready',            // 'ready' | 'playing' | 'paused' | 'over'
  you: 0, cpu: 0,
  py: 0, cy: 0,              // paddle centres (px)
  bx: 0, by: 0, vx: 0, vy: 0,
  reduced: matchMedia('(prefers-reduced-motion:reduce)').matches,
};

function paddlePx(){ return H * CFG.paddleH; }

function serve(dir){
  G.bx = W/2; G.by = H/2;
  const ang = (Math.random()*0.5 - 0.25); // shallow angle
  const sp = CFG.ballSpeed0;
  G.vx = dir * sp * Math.cos(ang);
  G.vy = sp * Math.sin(ang) * (Math.random()<0.5?1:-1);
}

function newGame(){
  resize();
  G.you = 0; G.cpu = 0;
  G.py = H/2; G.cy = H/2;
  updateScore();
  serve(Math.random()<0.5 ? -1 : 1);
  G.state = 'playing';
  modal.hidden = true;
}

function updateScore(){ elYou.textContent = G.you; elCpu.textContent = G.cpu; }

function point(who){
  if (who === 'you') G.you++; else G.cpu++;
  updateScore();
  if (G.you >= CFG.winScore || G.cpu >= CFG.winScore){ return endGame(); }
  G.py = clamp(G.py, paddlePx()/2, H - paddlePx()/2);
  serve(who === 'you' ? -1 : 1); // serve toward the loser
}

function endGame(){
  G.state = 'over';
  const win = G.you > G.cpu;
  cardTitle.textContent = win ? 'You win!' : 'Cam wins';
  cardTitle.className = win ? 'you' : 'cpu';
  cardText.innerHTML = 'Final <span class="big">'+G.you+' — '+G.cpu+'</span>';
  document.querySelector('.rules').textContent = win
    ? 'Nice rallies. Go again?'
    : 'Cam got the better of that one. Rematch?';
  startBtn.textContent = 'Play again';
  modal.hidden = false;
}

const clamp = (v,a,b)=> v<a?a : v>b?b : v;

/* ---- Physics step (fixed timestep) ---- */
function step(){
  const ph = paddlePx();
  // CPU: ease toward ball with a little jitter, only when ball approaches it
  const aim = G.by + (G.reduced ? 0 : (Math.sin(G.bx*0.01) * ph * CFG.cpuMiss));
  G.cy += (aim - G.cy) * CFG.cpuEase;
  G.cy = clamp(G.cy, ph/2, H - ph/2);

  // move ball
  G.bx += G.vx; G.by += G.vy;

  // top/bottom walls
  if (G.by < CFG.ballR){ G.by = CFG.ballR; G.vy = Math.abs(G.vy); }
  if (G.by > H - CFG.ballR){ G.by = H - CFG.ballR; G.vy = -Math.abs(G.vy); }

  const px = 18, cx = W - 18; // paddle x positions
  // player paddle (left)
  if (G.vx < 0 && G.bx - CFG.ballR < px + CFG.paddleW &&
      G.bx > px && Math.abs(G.by - G.py) < ph/2 + CFG.ballR){
    G.bx = px + CFG.paddleW + CFG.ballR;
    bounce(G.py, ph, 1);
  }
  // cpu paddle (right)
  if (G.vx > 0 && G.bx + CFG.ballR > cx - CFG.paddleW &&
      G.bx < cx && Math.abs(G.by - G.cy) < ph/2 + CFG.ballR){
    G.bx = cx - CFG.paddleW - CFG.ballR;
    bounce(G.cy, ph, -1);
  }

  // scoring
  if (G.bx < -CFG.ballR) point('cpu');
  else if (G.bx > W + CFG.ballR) point('you');
}

function bounce(paddleCentre, ph, dir){
  const rel = (G.by - paddleCentre) / (ph/2);          // -1..1
  const speed = Math.min(Math.hypot(G.vx,G.vy) * CFG.ballSpeedUp, CFG.ballSpeedMax);
  const ang = rel * (Math.PI/3.2);                     // up to ~56°
  G.vx = dir * speed * Math.cos(ang);
  G.vy = speed * Math.sin(ang);
}

/* ---- Render ---- */
function draw(){
  ctx.clearRect(0,0,W,H);
  // court
  ctx.fillStyle = getCss('--court'); ctx.fillRect(0,0,W,H);
  // centre net
  ctx.strokeStyle = getCss('--line'); ctx.lineWidth = 2;
  ctx.setLineDash([8,10]); ctx.beginPath();
  ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);

  const ph = paddlePx();
  // player paddle (accent)
  ctx.fillStyle = CFG.accent;
  roundRect(18, G.py-ph/2, CFG.paddleW, ph, 5);
  // cpu paddle (paper)
  ctx.fillStyle = getCss('--paper');
  roundRect(W-18-CFG.paddleW, G.cy-ph/2, CFG.paddleW, ph, 5);

  // ball = Cam #106, or a disc fallback
  if (camReady){
    const d = CFG.ballR*2.6;
    ctx.save(); ctx.beginPath();
    ctx.arc(G.bx, G.by, d/2, 0, Math.PI*2); ctx.closePath(); ctx.clip();
    ctx.drawImage(camImg, G.bx-d/2, G.by-d/2, d, d); ctx.restore();
    ctx.strokeStyle = CFG.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(G.bx,G.by,d/2,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.fillStyle = CFG.accent;
    ctx.beginPath(); ctx.arc(G.bx,G.by,CFG.ballR,0,Math.PI*2); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---- Loop (fixed step, decoupled from refresh rate) ---- */
let last = 0, acc = 0; const DT = 1000/60;
function frame(t){
  if (!last) last = t;
  acc += Math.min(t - last, 60); last = t;
  if (G.state === 'playing'){ while (acc >= DT){ step(); acc -= DT; } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- Input: keyboard (desktop) + drag (mobile) ---- */
const keys = {};
addEventListener('keydown', e=>{
  if (['ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
  if (e.key === 'p' || e.key === 'P') togglePause();
  keys[e.key] = true;
});
addEventListener('keyup', e=> keys[e.key] = false);
function keyLoop(){
  if (G.state === 'playing'){
    const spd = H*0.02;
    if (keys['ArrowUp']) G.py -= spd;
    if (keys['ArrowDown']) G.py += spd;
    G.py = clamp(G.py, paddlePx()/2, H - paddlePx()/2);
  }
  requestAnimationFrame(keyLoop);
}
requestAnimationFrame(keyLoop);

function pointerMove(clientY){
  const r = cv.getBoundingClientRect();
  G.py = clamp(clientY - r.top, paddlePx()/2, H - paddlePx()/2);
}
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); pointerMove(e.clientY); });
cv.addEventListener('pointermove', e=>{ if (e.pressure>0 || e.buttons>0 || e.pointerType==='touch') pointerMove(e.clientY); });

function togglePause(){
  if (G.state === 'playing'){ G.state='paused'; cardTitle.textContent='Paused';
    cardTitle.className=''; cardText.textContent=''; document.querySelector('.rules').textContent='';
    startBtn.textContent='Resume'; modal.hidden=false; }
  else if (G.state === 'paused'){ G.state='playing'; modal.hidden=true; last=0; }
}

startBtn.addEventListener('click', ()=>{
  if (G.state === 'paused'){ G.state='playing'; modal.hidden=true; last=0; return; }
  newGame(); last=0;
});

resize();
</script>
<script id="fb-sticky">
/* ==========================================================================
   FinnBots STICKINESS LAYER — the reason a player takes one more run.
   Founder rule, 2026-09-25: "provide a UI/UX that will support stickiness
   with players."

   SOURCE OF TRUTH. Injected by apply-device.js as <script id="fb-sticky">
   just before </body>. It is deliberately tiny and entirely passive:

     - it NEVER touches the engine, the wallet layer, the network or a wallet
     - it reads the score the game ALREADY prints into #oScore
     - it stores one number per game in localStorage, and nothing else

   What it adds, and why each one earns its place:
     1. A personal best you can always see.  A score with nothing to beat is a
        number; a score next to your best is a challenge.
     2. A run-over line that says exactly how close you came ("1,240 short" /
        "NEW BEST +900").  The gap is what makes the next run feel winnable.
     3. A session run counter, so a streak is visible while it is happening.
     4. Enter / Space / Return restarts from the run-over card.  The single
        biggest drop-off in an arcade loop is the pause between runs — the
        fastest possible replay is the strongest retention feature there is.
   ========================================================================== */
(function(){
  try{
    var NS = 'fb:' + (location.hostname.split('.')[0] || 'game') + ':';
    var $  = function(id){ return document.getElementById(id); };
    var read = function(k,d){ try{ var v=localStorage.getItem(NS+k); return v==null?d:(JSON.parse(v)); }catch(e){ return d; } };
    var save = function(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} };
    var fmt  = function(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
    var num  = function(t){ var n=parseInt(String(t||'').replace(/[^0-9]/g,''),10); return isFinite(n)?n:0; };

    var best = num(read('best', 0)), runs = 0;

    /* ---- 1. the chip, in the topbar beside the title ---- */
    var chip = document.createElement('span');
    chip.className = 'fb-best';
    function paintChip(isNew){
      chip.innerHTML = '<i>BEST</i> <b>' + fmt(best) + '</b>';
      chip.classList.toggle('is-new', !!isNew);
      chip.hidden = !best;
    }
    paintChip(false);
    var title = document.querySelector('.topbar .title, .topbar h1, header .title');
    if(title && title.parentNode) title.parentNode.insertBefore(chip, title.nextSibling);

    /* ---- 2. the run-over line ---- */
    var over = $('overOverlay'), card = $('overCard'), scoreEl = $('oScore');
    if(!over || !card || !scoreEl) return;       // not a chassis run-over card: do nothing
    var line = document.createElement('p');
    line.className = 'fb-runline';
    var retry = $('retryBtn');
    if(retry && retry.parentNode) retry.parentNode.insertBefore(line, retry);
    else card.appendChild(line);

    var shown = false;
    function onShow(){
      var score = num(scoreEl.textContent);
      runs++;
      var isNew = score > best, gap = best - score;
      if(isNew){
        var by = score - best;
        best = score; save('best', best);
        line.innerHTML = '<span class="go">NEW BEST · +' + fmt(by) + '</span>' +
                         '<small>run ' + runs + ' this session</small>';
      } else if(best > 0){
        line.innerHTML = '<span class="gap">' + fmt(gap) + ' short of your best</span>' +
                         '<small>best ' + fmt(best) + ' · run ' + runs + ' this session</small>';
      } else {
        best = score; save('best', best);
        line.innerHTML = '<span class="go">First run banked</span>' +
                         '<small>beat ' + fmt(best) + ' next time</small>';
      }
      paintChip(isNew);
    }

    new MutationObserver(function(){
      var on = over.classList.contains('show');
      if(on && !shown){ shown = true; onShow(); }
      else if(!on){ shown = false; }
    }).observe(over, { attributes:true, attributeFilter:['class'] });

    /* ---- 3. one-key replay, and the focus trap it exposed ------------------
       Closing a dialog returns focus to the button that opened it — correct
       accessibility, and the chassis does it. But a focused <button> then eats
       ENTER and SPACE, so mid-game those keys re-open HOW TO PLAY instead of
       playing: Space IS the fire key in several games, and this layer had just
       taught players to press Enter between runs, which made a latent bug easy
       to hit (Founder, 2026-09-25, seen on a round clear).

       So: Enter/Space replay when the run-over card is up; they are left alone
       while ANY other dialog is open, because its buttons must still work; and
       otherwise the focused control is blurred and the key swallowed, so game
       keys can never operate the chrome. Capture phase, because this has to run
       before the button's own activation. */
    var anyDialog = function(){ return !!document.querySelector('.overlay.show, .sheet.show'); };
    addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      if(over.classList.contains('show')){
        e.preventDefault();
        if(retry) retry.click();
        return;
      }
      if(anyDialog()) return;                       // another dialog owns the keyboard
      var a = document.activeElement;
      if(a && a !== document.body && /^(BUTTON|A|SUMMARY)$/.test(a.tagName)){
        a.blur();
        e.preventDefault();
      }
    }, true);
  }catch(e){ /* stickiness must never break a game */ }
})();
</script>
</body>
</html>
